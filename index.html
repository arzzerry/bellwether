<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bellwether</title>
<meta name="description" content="A private watchlist, portfolio tracker, screener and trade journal that keeps everything on your own machine." />
<meta name="theme-color" content="#0a0a0b" />
<style>
:root{
  /* Obsidian and platinum. Colour is spent only where it carries meaning:
     gains, losses, and the one accent that marks what is actionable.
     Everything else is a neutral, and the hierarchy is carried by weight
     and space rather than hue. */
  --ink:#0a0a0b;
  --ink-2:#0e0e10;
  --glass:#141416;
  --glass-2:#1a1a1d;
  --glass-3:#232327;
  --line:rgba(255,255,255,.075);
  --line-2:rgba(255,255,255,.15);
  --accent:#e8e8ec;
  --accent-2:#c6c6ce;
  --accent-3:#82828d;
  --accent-ink:#131315;
  --text:#f4f4f5;
  --text-2:#a1a1aa;
  --text-3:#6e6e78;
  --up:#46c17e;
  --up-bg:rgba(70,193,126,.13);
  --down:#ef6a5c;
  --down-bg:rgba(239,106,92,.13);
  --radius:12px;
  --radius-sm:9px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --pad:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--ink);
  color:var(--text);
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  overflow-x:hidden;
}
/* One barely-there lift at the top so the page is not a dead flat black.
   No noise, no colour washes: the restraint is the point. */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(1200px 680px at 50% -12%, rgba(255,255,255,.035), transparent 62%),
    linear-gradient(180deg,#0b0b0c 0%,#0a0a0b 40%,#080809 100%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:rgba(255,255,255,.25)}

.wrap{max-width:1180px;margin:0 auto;padding:0 16px 120px}

/* ---------- header ---------- */
header.top{
  position:sticky;top:0;z-index:40;
  background:var(--ink);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;flex:none}
.brand h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.2px}
.brand .tag{font-size:11px;color:var(--text-3);letter-spacing:.14em;text-transform:uppercase;margin-top:-2px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--glass-2);display:grid;place-items:center;color:var(--text-2);
  transition:.15s;
}
.icon-btn:hover{color:var(--accent);border-color:var(--line-2);background:var(--glass-3)}
.icon-btn svg{width:17px;height:17px}
.icon-btn.signed{color:var(--accent);border-color:var(--line-2);background:rgba(255,255,255,.09)}
.stale{font-size:11.5px;color:var(--text-3);font-family:var(--mono);white-space:nowrap}

/* ---------- tabs ---------- */
nav.tabs{
  position:sticky;top:55px;z-index:35;
  background:var(--ink);
  border-bottom:1px solid var(--line);
}
.tabs-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{
  padding:12px 15px;font-size:14px;color:var(--text-3);border-bottom:2px solid transparent;
  white-space:nowrap;transition:.15s;font-weight:500;
}
.tab:hover{color:var(--text-2)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* ---------- cards ---------- */
.card{
  background:var(--glass);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 1px 2px rgba(0,0,0,.4);
}
.card.pad{padding:var(--pad)}
.section{margin-top:22px}
.section-head{display:flex;align-items:center;gap:12px;margin:0 2px 12px}
.section-head h2{font-size:15px;font-weight:600;margin:0;letter-spacing:.1px}
.section-head .sub{font-size:12.5px;color:var(--text-3)}
.section-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ---------- buttons ---------- */
.btn{
  padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--line-2);
  background:var(--glass-2);color:var(--text);font-size:13.5px;font-weight:500;
  transition:.15s;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{background:var(--glass-3);border-color:var(--accent-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:#ffffff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-3)}
.btn.ghost:hover{color:var(--text);background:var(--glass-2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{color:var(--down);border-color:rgba(217,122,108,.3)}
.btn.danger:hover{background:var(--down-bg)}
.btn svg{width:15px;height:15px}
.btn:disabled{opacity:.42;cursor:not-allowed}

/* ---------- inputs ---------- */
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:#0e0e10;color:var(--text);
  font-size:14px;transition:.15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--line-2);background:#111113;box-shadow:0 0 0 3px rgba(255,255,255,.05)}
input::placeholder,textarea::placeholder{color:var(--text-3)}
textarea{resize:vertical;min-height:70px;line-height:1.55}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 9px center;background-size:15px;padding-right:32px}
label.fld{display:block;margin-bottom:12px}
label.fld > span{display:block;font-size:12px;color:var(--text-2);margin-bottom:5px;letter-spacing:.02em}
.row{display:grid;gap:12px}
.row.c2{grid-template-columns:1fr 1fr}
.row.c3{grid-template-columns:repeat(3,1fr)}
.row.c4{grid-template-columns:repeat(4,1fr)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:14px 16px;border-radius:var(--radius-sm);background:var(--glass-2);border:1px solid var(--line)}
.stat .k{font-size:11.5px;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase}
.stat .v{font-size:22px;font-family:var(--mono);margin-top:5px;letter-spacing:-.4px}
.stat .d{font-size:12.5px;font-family:var(--mono);margin-top:2px;color:var(--text-3)}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{
  text-align:right;font-weight:500;font-size:11.5px;color:var(--text-3);
  letter-spacing:.06em;text-transform:uppercase;padding:0 12px 9px;white-space:nowrap;
  border-bottom:1px solid var(--line);
}
table.t th:first-child,table.t td:first-child{text-align:left;padding-left:2px}
table.t th.sortable{cursor:pointer}
table.t th.sortable:hover{color:var(--accent-2)}
table.t td{padding:11px 12px;text-align:right;border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap}
table.t tbody tr{transition:.12s}
table.t tbody tr:hover{background:rgba(255,255,255,.045)}
table.t tbody tr.clickable{cursor:pointer}
table.t td.num{font-family:var(--mono);letter-spacing:-.2px}
table.t tr:last-child td{border-bottom:none}
.sym{font-weight:600;letter-spacing:.3px}
.sym-sub{font-size:12px;color:var(--text-3);font-weight:400;letter-spacing:0;margin-top:1px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--up)}
.down{color:var(--down)}
.flat{color:var(--text-3)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-family:var(--mono);}
.pill.up{background:var(--up-bg)}
.pill.down{background:var(--down-bg)}
.pill.flat{background:rgba(255,255,255,.08)}
.tagchip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;background:rgba(255,255,255,.1);color:var(--accent-2);border:1px solid var(--line);margin:2px 4px 2px 0}

/* ---------- empty ---------- */
.empty{text-align:center;padding:44px 20px;color:var(--text-3)}
.empty svg{width:34px;height:34px;opacity:.45;margin-bottom:12px}
.empty h3{margin:0 0 6px;font-size:15px;font-weight:500;color:var(--text-2)}
.empty p{margin:0 auto;max-width:400px;font-size:13.5px;line-height:1.6}
.empty .btn{margin-top:16px}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.66);

  display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto;
  animation:fade .16s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:560px;background:#18181b;
  border:1px solid var(--line-2);border-radius:var(--radius);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.95);
  animation:pop .18s cubic-bezier(.2,.9,.3,1.1);
}
.modal.wide{max-width:920px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16px;font-weight:600}
.modal-head .close{margin-left:auto}
.modal-body{padding:18px}
.modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}

/* ---------- toast ---------- */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  padding:10px 18px;border-radius:99px;background:#1f1f23;
  border:1px solid var(--line-2);font-size:13.5px;
  box-shadow:0 14px 34px -16px rgba(0,0,0,.9);animation:rise .2s ease;max-width:90vw;
}
.toast.err{border-color:rgba(217,122,108,.4);color:#f0b9b1}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- chart ---------- */
.chart-box{position:relative;width:100%;height:280px}
.chart-box svg{width:100%;height:100%;display:block;overflow:visible}
.cx-line{stroke:var(--accent-3);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
.tip{
  position:absolute;pointer-events:none;padding:8px 11px;border-radius:9px;
  background:rgba(12,28,27,.96);border:1px solid var(--line-2);font-size:12.5px;
  font-family:var(--mono);white-space:nowrap;z-index:5;line-height:1.5;
  box-shadow:0 10px 24px -12px rgba(0,0,0,.9);
}
.range-btns{display:flex;gap:3px;flex-wrap:wrap}
.range-btns button{padding:4px 10px;border-radius:7px;font-size:12px;color:var(--text-3);border:1px solid transparent}
.range-btns button.on{color:var(--accent);background:var(--glass-3);border-color:var(--line)}
.range-btns button:hover{color:var(--text-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-3);margin-top:8px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px;border-radius:2px}

/* ---------- sparkline ---------- */
.spark{width:74px;height:26px;vertical-align:middle;display:inline-block}

/* ---------- detail ---------- */
.det-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.det-price{font-size:30px;font-family:var(--mono);letter-spacing:-1px;line-height:1.1}
/* The tile colour sits on the container too, so a part-filled last row reads
   as empty space rather than as a differently shaded cell. */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--glass-2);border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.metric{background:var(--glass-2);padding:11px 13px;outline:1px solid var(--line)}
.metric .k{font-size:11px;color:var(--text-3);letter-spacing:.04em}
.metric .v{font-size:15px;font-family:var(--mono);margin-top:3px}
.news-item{display:block;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.07);color:var(--text)}
.news-item:hover{text-decoration:none;color:var(--accent)}
.news-item .h{font-size:13.5px;line-height:1.45}
.news-item .m{font-size:11.5px;color:var(--text-3);margin-top:3px;font-family:var(--mono)}
.bar-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.bar-row .lbl{width:62px;font-weight:600;font-size:13px;flex:none}
.bar-track{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.bar-fill{height:100%;background:var(--accent-2);border-radius:99px}
.bar-row .val{width:64px;text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--text-2);flex:none}

/* ---------- misc ---------- */
.note{font-size:12.5px;color:var(--text-3);line-height:1.6}
.warn{padding:11px 14px;border-radius:var(--radius-sm);background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:13px;color:var(--text-2);line-height:1.6}
.rule-row{display:grid;grid-template-columns:1.5fr .9fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.prog{height:3px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.j-entry{padding:15px 16px;border-radius:var(--radius-sm);background:var(--glass-2);border:1px solid var(--line);margin-bottom:10px}
.j-entry .jh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.j-entry .jb{font-size:13.5px;color:var(--text-2);line-height:1.65;margin-top:9px;white-space:pre-wrap}
.conv{display:inline-flex;gap:2px;vertical-align:middle}
.conv i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.2)}
.conv i.on{background:var(--accent)}
footer.foot{text-align:center;padding:36px 16px 20px;color:var(--text-3);font-size:12px;line-height:1.7}

@media(max-width:720px){
  .row.c2,.row.c3,.row.c4{grid-template-columns:1fr}
  .rule-row{grid-template-columns:1fr 1fr;gap:6px}
  .top-in{padding:10px 14px}
  .brand h1{font-size:17px}
  .stat .v{font-size:19px}
  .det-price{font-size:26px}
  nav.tabs{top:51px}
  .modal-body{padding:15px}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="14.5" stroke="rgba(255,255,255,.18)"/>
        <path d="M6 22.5 L12 15 L17 19 L26 8.5" stroke="#e8e8ec" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="15" r="2.1" fill="#46c17e"/>
        <path d="M21.5 8.5 H26 V13" stroke="#e8e8ec" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>Bellwether</h1>
        <div class="tag">watch · hold · test · record</div>
      </div>
    </div>
    <div class="top-actions">
      <span class="stale" id="lastSync"></span>
      <button class="icon-btn" id="btnRefresh" title="Refresh quotes" aria-label="Refresh quotes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="btnAccount" title="Sign in to sync" aria-label="Account" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 5 8.9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9.5a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-in" id="tabbar">
    <button class="tab on" data-tab="watch">Watchlist</button>
    <button class="tab" data-tab="port">Portfolio</button>
    <button class="tab" data-tab="screen">Screener</button>
    <button class="tab" data-tab="journal">Journal</button>
  </div>
</nav>

<main class="wrap" id="main"></main>

<footer class="foot">
  Bellwether keeps every holding, note and key in this browser only. Nothing is sent anywhere except the price providers you choose.<br/>
  For research and record keeping. Not investment advice.
</footer>

<div id="toasts"></div>

<script>
"use strict";

/* ============================ helpers ============================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const clamp = (n,a,b) => Math.max(a, Math.min(b, n));
const todayISO = () => new Date().toISOString().slice(0,10);

function money(n, dp=2){
  if(n==null || !isFinite(n)) return "—";
  const s = Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp});
  return (n<0?"-":"") + CUR() + s;
}
function num(n, dp=2){
  if(n==null || !isFinite(n)) return "—";
  return n.toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp});
}
function pct(n, dp=2){
  if(n==null || !isFinite(n)) return "—";
  return (n>0?"+":"") + n.toFixed(dp) + "%";
}
function compact(n){
  if(n==null || !isFinite(n)) return "—";
  const a = Math.abs(n);
  if(a>=1e12) return (n/1e12).toFixed(2)+"T";
  if(a>=1e9) return (n/1e9).toFixed(2)+"B";
  if(a>=1e6) return (n/1e6).toFixed(1)+"M";
  if(a>=1e3) return (n/1e3).toFixed(1)+"K";
  return n.toFixed(0);
}
/* Chart and sparkline colours come from the CSS variables, so a theme
   change is a token change and never a hunt through the drawing code. */
const CSSV = (() => {
  const cache = {};
  return n => cache[n] || (cache[n] = getComputedStyle(document.documentElement).getPropertyValue(n).trim());
})();

const dirClass = n => n==null||!isFinite(n)||n===0 ? "flat" : (n>0?"up":"down");
function ago(ts){
  if(!ts) return "never";
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}
function niceDate(d){
  if(!d) return "—";
  const dt = typeof d === "string" ? new Date(d+"T00:00:00") : new Date(d);
  if(isNaN(dt)) return "—";
  return dt.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
}

function toast(msg, isErr=false){
  const t = document.createElement("div");
  t.className = "toast" + (isErr?" err":"");
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .3s"; t.style.opacity="0"; setTimeout(()=>t.remove(),300); }, isErr?4200:2400);
}

/* ============================ api ============================ */
/* Two free providers, both optional.
   Finnhub  — quotes, company profile, fundamentals, news, symbol search. 60/min free.
   TwelveData — daily price history for charts. 8/min, 800/day free. */

class Limiter{
  constructor(perMin){ this.gap = 60000/perMin; this.last = 0; this.q = Promise.resolve(); }
  run(fn){
    this.q = this.q.then(async ()=>{
      const wait = this.gap - (Date.now() - this.last);
      if(wait > 0) await new Promise(r=>setTimeout(r, wait));
      this.last = Date.now();
      return fn();
    });
    return this.q;
  }
}
const fhLimit = new Limiter(55);
const tdLimit = new Limiter(7);

class NoKey extends Error{ constructor(p){ super("Add your free "+p+" key in settings."); this.provider=p; } }

async function fh(path, params={}){
  if(!S.keys.finnhub) throw new NoKey("Finnhub");
  const u = new URL("https://finnhub.io/api/v1"+path);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  u.searchParams.set("token", S.keys.finnhub);
  return fhLimit.run(async ()=>{
    const r = await fetch(u);
    if(r.status===401 || r.status===403) throw new Error("Finnhub rejected the key, or this endpoint needs a paid plan.");
    if(r.status===429) throw new Error("Finnhub rate limit hit. Wait a moment.");
    if(!r.ok) throw new Error("Finnhub error "+r.status);
    return r.json();
  });
}
async function td(path, params={}){
  if(!S.keys.twelve) throw new NoKey("Twelve Data");
  const u = new URL("https://api.twelvedata.com"+path);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  u.searchParams.set("apikey", S.keys.twelve);
  return tdLimit.run(async ()=>{
    const r = await fetch(u);
    const j = await r.json().catch(()=>({}));
    if(j && j.status === "error") throw new Error(j.message || "Twelve Data error");
    if(!r.ok) throw new Error("Twelve Data error "+r.status);
    return j;
  });
}

const FRESH_QUOTE = 1000*60*10;
const FRESH_SLOW  = 1000*60*60*24;
const FRESH_NEWS  = 1000*60*60*6;

async function getQuote(sym, force=false){
  const c = C.quotes[sym];
  if(!force && c && Date.now()-c.t < FRESH_QUOTE) return c.d;
  const j = await fh("/quote", {symbol:sym});
  if(j.c === 0 && j.pc === 0) throw new Error(sym+" returned no price. Check the ticker.");
  const d = { price:j.c, chg:j.d, chgPct:j.dp, high:j.h, low:j.l, open:j.o, prev:j.pc };
  C.quotes[sym] = {t:Date.now(), d};
  saveCache();
  return d;
}
async function getProfile(sym){
  const c = C.profiles[sym];
  if(c && Date.now()-c.t < FRESH_SLOW*7) return c.d;
  const j = await fh("/stock/profile2", {symbol:sym});
  const d = { name:j.name||sym, industry:j.finnhubIndustry||"", cap:(j.marketCapitalization||0)*1e6,
              exchange:j.exchange||"", currency:j.currency||"", web:j.weburl||"", ipo:j.ipo||"", logo:j.logo||"" };
  C.profiles[sym] = {t:Date.now(), d};
  saveCache();
  return d;
}
const M_FIELDS = {
  pe:"peBasicExclExtraTTM", pb:"pbAnnual", ps:"psTTM", roe:"roeTTM", roa:"roaTTM",
  netMargin:"netProfitMarginTTM", grossMargin:"grossMarginTTM",
  revGrowth:"revenueGrowthTTMYoy", epsGrowth:"epsGrowthTTMYoy",
  divYield:"dividendYieldIndicatedAnnual", beta:"beta",
  debtEq:"totalDebt/totalEquityAnnual", currentRatio:"currentRatioAnnual",
  hi52:"52WeekHigh", lo52:"52WeekLow", ret1y:"52WeekPriceReturnDaily"
};
async function getMetrics(sym){
  const c = C.metrics[sym];
  if(c && Date.now()-c.t < FRESH_SLOW) return c.d;
  const j = await fh("/stock/metric", {symbol:sym, metric:"all"});
  const m = j.metric || {};
  const d = {};
  for(const [k,src] of Object.entries(M_FIELDS)){
    const v = m[src];
    d[k] = (typeof v === "number" && isFinite(v)) ? v : null;
  }
  C.metrics[sym] = {t:Date.now(), d};
  saveCache();
  return d;
}
async function getNews(sym){
  const c = C.news[sym];
  if(c && Date.now()-c.t < FRESH_NEWS) return c.d;
  const to = todayISO();
  const from = new Date(Date.now()-1000*60*60*24*21).toISOString().slice(0,10);
  const j = await fh("/company-news", {symbol:sym, from, to});
  const d = (Array.isArray(j)?j:[]).slice(0,12).map(n=>({h:n.headline,u:n.url,s:n.source,t:n.datetime}));
  C.news[sym] = {t:Date.now(), d};
  saveCache();
  return d;
}
async function getSeries(sym){
  const c = C.series[sym];
  if(c && Date.now()-c.t < FRESH_SLOW) return c.d;
  const j = await td("/time_series", {symbol:sym, interval:"1day", outputsize:"1300", order:"ASC"});
  const vals = j.values || [];
  if(!vals.length) throw new Error("No price history for "+sym);
  const d = vals.map(v=>({ d:v.datetime, c:parseFloat(v.close), h:parseFloat(v.high), l:parseFloat(v.low), v:parseFloat(v.volume||0) }))
                .filter(x=>isFinite(x.c));
  C.series[sym] = {t:Date.now(), d};
  saveCache();
  return d;
}
async function searchSym(q){
  const j = await fh("/search", {q});
  return (j.result||[]).filter(r=>r.type==="Common Stock" || !r.type).slice(0,10)
    .map(r=>({sym:r.displaySymbol||r.symbol, name:r.description}));
}

/* ============================ chart ============================ */
function sma(arr, n){
  const out = new Array(arr.length).fill(null);
  let sum = 0;
  for(let i=0;i<arr.length;i++){
    sum += arr[i];
    if(i>=n) sum -= arr[i-n];
    if(i>=n-1) out[i] = sum/n;
  }
  return out;
}
const RANGES = {"1M":22,"3M":66,"6M":132,"1Y":252,"5Y":1260,"Max":99999};

function drawChart(box, full, rangeKey, showMA){
  const keep = RANGES[rangeKey] || 252;
  const data = full.slice(Math.max(0, full.length - keep));
  if(data.length < 2){ box.innerHTML = `<div class="empty"><p>Not enough history to chart.</p></div>`; return; }

  const closes = full.map(x=>x.c);
  const ma50f = sma(closes,50), ma200f = sma(closes,200);
  const off = full.length - data.length;
  const ma50 = ma50f.slice(off), ma200 = ma200f.slice(off);

  const W = box.clientWidth || 700, H = box.clientHeight || 280;
  const P = {t:12, r:52, b:22, l:6};
  const iw = W - P.l - P.r, ih = H - P.t - P.b;

  let lo = Infinity, hi = -Infinity;
  data.forEach(d=>{ lo=Math.min(lo,d.c); hi=Math.max(hi,d.c); });
  if(showMA.m50) ma50.forEach(v=>{ if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v);} });
  if(showMA.m200) ma200.forEach(v=>{ if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v);} });
  const pad = (hi-lo)*0.08 || 1;
  lo -= pad; hi += pad;

  const X = i => P.l + (i/(data.length-1))*iw;
  const Y = v => P.t + ih - ((v-lo)/(hi-lo))*ih;

  const path = vals => {
    let d = "", started = false;
    vals.forEach((v,i)=>{
      if(v==null){ started=false; return; }
      d += (started?"L":"M") + X(i).toFixed(1) + " " + Y(v).toFixed(1) + " ";
      started = true;
    });
    return d.trim();
  };
  const line = path(data.map(d=>d.c));
  const area = line ? line + ` L ${X(data.length-1).toFixed(1)} ${(P.t+ih).toFixed(1)} L ${X(0).toFixed(1)} ${(P.t+ih).toFixed(1)} Z` : "";

  const up = data[data.length-1].c >= data[0].c;
  const stroke = up ? CSSV("--up") : CSSV("--down");

  const ticks = 4;
  let grid = "";
  for(let i=0;i<=ticks;i++){
    const v = lo + (hi-lo)*(i/ticks);
    const y = Y(v);
    grid += `<line x1="${P.l}" y1="${y.toFixed(1)}" x2="${P.l+iw}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`;
    grid += `<text x="${P.l+iw+8}" y="${(y+4).toFixed(1)}" fill="${CSSV("--text-3")}" font-size="11" font-family="var(--mono)">${v.toFixed(v>500?0:2)}</text>`;
  }
  const nLab = Math.min(5, data.length);
  let xlab = "";
  for(let i=0;i<nLab;i++){
    const idx = Math.round(i*(data.length-1)/(nLab-1||1));
    const dt = new Date(data[idx].d);
    const txt = dt.toLocaleDateString(undefined,{month:"short",year:keep>260?"2-digit":undefined,day:keep<70?"numeric":undefined});
    xlab += `<text x="${X(idx).toFixed(1)}" y="${H-5}" fill="${CSSV("--text-3")}" font-size="11" text-anchor="${i===0?"start":(i===nLab-1?"end":"middle")}">${esc(txt)}</text>`;
  }

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${stroke}" stop-opacity=".22"/>
      <stop offset="100%" stop-color="${stroke}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}${xlab}
    <path d="${area}" fill="url(#ag)"/>
    ${showMA.m200 ? `<path d="${path(ma200)}" fill="none" stroke="${CSSV("--text-2")}" stroke-width="1.2" stroke-dasharray="5 4" opacity=".75"/>` : ""}
    ${showMA.m50 ? `<path d="${path(ma50)}" fill="none" stroke="${CSSV("--accent-2")}" stroke-width="1.2" opacity=".75"/>` : ""}
    <path d="${line}" fill="none" stroke="${stroke}" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
    <g id="cx" style="display:none">
      <line class="cx-line" y1="${P.t}" y2="${P.t+ih}"/>
      <circle r="3.5" fill="${stroke}" stroke="${CSSV("--ink")}" stroke-width="1.5"/>
    </g>
  </svg><div class="tip" style="display:none"></div>`;

  const svg = box.querySelector("svg"), cx = box.querySelector("#cx"), tip = box.querySelector(".tip");
  const cxLine = cx.querySelector("line"), cxDot = cx.querySelector("circle");

  function move(ev){
    const r = svg.getBoundingClientRect();
    const px = ((ev.touches?ev.touches[0].clientX:ev.clientX) - r.left) / r.width * W;
    let i = Math.round((px - P.l)/iw * (data.length-1));
    i = clamp(i, 0, data.length-1);
    const d = data[i], x = X(i), y = Y(d.c);
    cx.style.display = "";
    cxLine.setAttribute("x1", x); cxLine.setAttribute("x2", x);
    cxDot.setAttribute("cx", x); cxDot.setAttribute("cy", y);
    const chg = ((d.c - data[0].c)/data[0].c)*100;
    tip.innerHTML = `${esc(niceDate(d.d))}<br/><span style="font-size:14px">${money(d.c)}</span> <span class="${dirClass(chg)}">${pct(chg,1)}</span>`;
    tip.style.display = "";
    const tw = tip.offsetWidth, boxW = box.clientWidth;
    const lx = clamp(x/W*boxW - tw/2, 2, boxW - tw - 2);
    tip.style.left = lx + "px";
    tip.style.top = clamp(y/H*box.clientHeight - 56, 0, box.clientHeight-50) + "px";
  }
  function leave(){ cx.style.display="none"; tip.style.display="none"; }
  svg.addEventListener("mousemove", move);
  svg.addEventListener("mouseleave", leave);
  svg.addEventListener("touchmove", e=>{ move(e); e.preventDefault(); }, {passive:false});
  svg.addEventListener("touchend", leave);
}

function sparkSVG(series){
  if(!series || series.length<2) return "";
  const d = series.slice(-60).map(x=>x.c);
  const lo = Math.min(...d), hi = Math.max(...d), rng = (hi-lo)||1;
  const pts = d.map((v,i)=>`${(i/(d.length-1)*72+1).toFixed(1)},${(24 - (v-lo)/rng*22 + 1).toFixed(1)}`).join(" ");
  const col = d[d.length-1] >= d[0] ? CSSV("--up") : CSSV("--down");
  return `<svg class="spark" viewBox="0 0 74 26"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/></svg>`;
}

let watchSort = {k:"sym", dir:1};

RENDERERS.watch = function(){

    </div>`) + keyNotice();
  }
  const rows = S.watch.map(w=>{
    const q = (C.quotes[w.sym]||{}).d, p = (C.profiles[w.sym]||{}).d, m = (C.metrics[w.sym]||{}).d, s = (C.series[w.sym]||{}).d;
    return {w, q, p, m, s};
  });
  rows.sort((a,b)=>{
    const k = watchSort.k;
    let av, bv;
    if(k==="sym"){ av=a.w.sym; bv=b.w.sym; return watchSort.dir * av.localeCompare(bv); }
    if(k==="price"){ av=a.q?.price; bv=b.q?.price; }
    else if(k==="chg"){ av=a.q?.chgPct; bv=b.q?.chgPct; }
    else if(k==="cap"){ av=a.p?.cap; bv=b.p?.cap; }
    else if(k==="pe"){ av=a.m?.pe; bv=b.m?.pe; }
    av = (av==null||!isFinite(av)) ? -Infinity : av;
    bv = (bv==null||!isFinite(bv)) ? -Infinity : bv;
    return watchSort.dir * (av-bv);
  });

  const body = rows.map(({w,q,p,m,s})=>`
    <tr class="clickable" data-sym="${esc(w.sym)}">
      <td>
        <div class="sym">${esc(w.sym)}</div>
        <div class="sym-sub">${esc(p?.name || w.note || "")}</div>
      </td>
      <td>${sparkSVG(s)}</td>
      <td class="num">${q?money(q.price):"—"}</td>
      <td class="num"><span class="pill ${dirClass(q?.chgPct)}">${q?pct(q.chgPct):"—"}</span></td>
      <td class="num">${p?compact(p.cap):"—"}</td>
      <td class="num">${m&&m.pe!=null?num(m.pe,1):"—"}</td>
      <td class="num">${m&&m.divYield!=null?num(m.divYield,2)+"%":"—"}</td>
      <td><button class="btn ghost sm" data-del="${esc(w.sym)}" title="Remove">✕</button></td>
    </tr>`).join("");

  const th = (k,label) => `<th class="sortable" data-sort="${k}">${label}${watchSort.k===k?(watchSort.dir>0?" ↑":" ↓"):""}</th>`;

  return `
  <div class="section">
    <div class="section-head">
      <h2>Watchlist</h2>
      <span class="sub">${S.watch.length} ${S.watch.length===1?"name":"names"}</span>
      <div class="right">
        <button class="btn sm" id="wRefresh">Refresh all</button>
        <button class="btn primary sm" id="wAdd">Add ticker</button>
      </div>
    </div>
    ${card(`<div class="tbl-wrap"><table class="t">
      <thead><tr>${th("sym","Symbol")}<th></th>${th("price","Price")}${th("chg","Today")}${th("cap","Mkt cap")}${th("pe","P/E")}<th>Yield</th><th></th></tr></thead>
      <tbody>${body}</tbody>
    </table></div>`,"")}
    ${keyNotice()}
  </div>`;
};

function addTickerModal(){
  modal("Add a ticker", `
    <label class="fld"><span>Search by name or symbol</span>
      <input type="text" id="qSym" placeholder="AAPL, or Apple" autocomplete="off" autofocus />
    </label>
    <div id="sResults"></div>
    <p class="note" style="margin-top:12px">Searching needs a Finnhub key. Without one you can still type an exact symbol and press add.</p>
  `, `<button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="sAdd">Add</button>`);

  const inp = $("#qSym"), res = $("#sResults");
  let timer;
  inp.oninput = ()=>{
    clearTimeout(timer);
    const q = inp.value.trim();
    if(q.length<2){ res.innerHTML=""; return; }
    timer = setTimeout(async ()=>{
      if(!S.keys.finnhub) return;
      res.innerHTML = `<p class="note">Searching…</p>`;
      try{
        const r = await searchSym(q);
        res.innerHTML = r.length ? `<div class="tbl-wrap"><table class="t"><tbody>${
          r.map(x=>`<tr class="clickable" data-pick="${esc(x.sym)}"><td><div class="sym">${esc(x.sym)}</div><div class="sym-sub">${esc(x.name)}</div></td><td><button class="btn sm">Add</button></td></tr>`).join("")
        }</tbody></table></div>` : `<p class="note">Nothing found.</p>`;
        $$("[data-pick]", res).forEach(tr=>tr.onclick = ()=>doAdd(tr.dataset.pick));
      }catch(e){ res.innerHTML = `<p class="note">${esc(e.message)}</p>`; }
    }, 320);
  };
  $("#sAdd").onclick = ()=>doAdd(inp.value.trim().toUpperCase());

  async function doAdd(sym){
    sym = (sym||"").toUpperCase().trim();
    if(!sym) return;
    if(!addWatch(sym)){ toast(sym+" is already on the list"); closeModal(); return; }
    closeModal(); render();
    toast(sym+" added");
    try{ await hydrate(sym); render(); }catch(e){ toast(e.message, true); }
  }
}

async function hydrate(sym, force=false){
  await getQuote(sym, force);
  try{ await getProfile(sym); }catch(e){}
  try{ await getMetrics(sym); }catch(e){}
}

async function refreshAll(force=false){
  const syms = Array.from(new Set([...S.watch.map(w=>w.sym), ...S.lots.map(l=>l.sym)]));
  if(!syms.length){ toast("Nothing to refresh"); return; }
  if(!S.keys.finnhub){ toast("Add a Finnhub key in settings first.", true); return; }
  const btn = $("#btnRefresh"); btn.style.opacity = ".4";
  let ok = 0, fail = 0;
  for(const s of syms){
    try{ await hydrate(s, force); ok++; }
    catch(e){ fail++; }
    if(TAB==="watch" || TAB==="port") render();
  }
  S.lastSync = Date.now(); save();
  btn.style.opacity = "";
  render();
  toast(fail ? `Refreshed ${ok}, ${fail} failed` : `Refreshed ${ok} ${ok===1?"name":"names"}`);
}

/* ============================ portfolio ============================ */
function lotMath(lot){
  const sold = (lot.sells||[]).reduce((a,s)=>a+s.shares, 0);
  const left = Math.max(0, lot.shares - sold);
  const perShareCost = lot.price + (lot.fees||0)/(lot.shares||1);
  const q = (C.quotes[lot.sym]||{}).d;
  const price = q?.price ?? null;
  const value = price!=null ? left*price : null;
  const cost = left*perShareCost;
  const unreal = value!=null ? value-cost : null;
  const realised = (lot.sells||[]).reduce((a,s)=>a + (s.price*s.shares - (s.fees||0) - s.shares*perShareCost), 0);
  const dayChg = (price!=null && q?.chg!=null) ? left*q.chg : null;
  return {left, sold, perShareCost, price, value, cost, unreal,
          unrealPct: cost>0 && unreal!=null ? unreal/cost*100 : null, realised, dayChg, open:left>1e-9};
}
function positionFor(sym){
  const lots = S.lots.filter(l=>l.sym===sym).map(l=>({l, m:lotMath(l)})).filter(x=>x.m.open);
  if(!lots.length) return null;
  const shares = lots.reduce((a,x)=>a+x.m.left,0);
  const cost = lots.reduce((a,x)=>a+x.m.cost,0);
  const value = lots.reduce((a,x)=>a+(x.m.value||0),0);
  return {shares, cost, avg:cost/shares, value, unreal:value-cost, unrealPct: cost>0?(value-cost)/cost*100:null};
}

  return `

function sellModal(id){
  const l = S.lots.find(x=>x.id===id);
  if(!l) return;
  const m = lotMath(l);
  const q = (C.quotes[l.sym]||{}).d;
  modal("Record a sale of "+l.sym, `
    <p class="note" style="margin-bottom:14px">You hold ${num(m.left, m.left%1?4:0)} shares at ${money(m.perShareCost)} all in.</p>
    <div class="row c3">

      <label class="fld"><span>Price per share</span><input type="number" id="sPrice" step="any" min="0" value="${q?q.price:""}" /></label>
      <label class="fld"><span>Fees</span><input type="number" id="sFees" step="any" min="0" value="0" /></label>
    </div>
    <label class="fld"><span>Date</span><input type="date" id="sDate" value="${todayISO()}" /></label>
    <p class="note" id="sOut"></p>

  `, `<button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="sSave">Record sale</button>`);

  const upd = ()=>{
    const sh = parseFloat($("#sShares").value)||0, pr = parseFloat($("#sPrice").value)||0, fe = parseFloat($("#sFees").value)||0;
    if(!sh || !pr){ $("#sOut").textContent = ""; return; }

    $("#sOut").innerHTML = `Proceeds ${money(pr*sh-fe)}. Realised <span class="${dirClass(gain)}">${money(gain)}</span>, a return of <span class="${dirClass(gain)}">${pct(gain/(sh*m.perShareCost)*100,1)}</span>.`;
  };
  ["sShares","sPrice","sFees"].forEach(i=>$("#"+i).oninput = upd);
  upd();

  $("#sSave").onclick = ()=>{
    const sh = parseFloat($("#sShares").value), pr = parseFloat($("#sPrice").value);

    l.sells = l.sells || [];
    l.sells.push({id:uid(), shares:sh, price:pr, fees:parseFloat($("#sFees").value)||0, date:$("#sDate").value||todayISO()});
    putLot(l); closeModal(); render(); toast("Sale recorded");
  };
}

function sortedRows(res){
  const k = scr.sort.k, d = scr.sort.dir;
  return res.rows.slice().sort((a,b)=>{
    let av = a[k], bv = b[k];
    if(typeof av === "string") return d*av.localeCompare(bv);
    av = (av==null||!isFinite(av)) ? -Infinity : av;
    bv = (bv==null||!isFinite(bv)) ? -Infinity : bv;
    return d*(av-bv);
  });
}

async function runScreen(){
  const syms = scr.universe==="broad"
    ? Array.from(new Set([...UNIVERSE, ...S.watch.map(w=>w.sym)]))
    : Array.from(new Set([...S.watch.map(w=>w.sym), ...S.lots.map(l=>l.sym)]));
  if(!syms.length){ toast("Nothing to screen. Add some names first.", true); return; }
  if(!S.keys.finnhub && !syms.some(s=>C.metrics[s])){
    toast("Add a Finnhub key in settings first.", true); return;
  }

  scr.running = true;
  const btn = $("#rRun"); btn.disabled = true; btn.textContent = "Running…";
  const prog = $("#prog"); prog.style.display = "";
  const bar = $("i", prog), note = $("#progNote");

  const rules = scr.rules.filter(r=>isFinite(r.v));
  const cols = Array.from(new Set(["cap","price", ...rules.map(r=>r.f)]));
  const rows = [];
  let done = 0, errs = 0;

  for(const sym of syms){
    try{
      const m = await getMetrics(sym);
      let q = (C.quotes[sym]||{}).d;
      const needQuote = rules.some(r=>r.f==="price"||r.f==="chgPct") || !q;
      if(needQuote){ try{ q = await getQuote(sym); }catch(e){} }
      const p = await getProfile(sym).catch(()=>null);

      const rec = {sym, name:p?.name||"", cap:p?.cap??null, price:q?.price??null, chgPct:q?.chgPct??null, ...m};
      rec.from52hi = (q?.price && m.hi52) ? (m.hi52-q.price)/m.hi52*100 : null;
      rec.from52lo = (q?.price && m.lo52) ? (q.price-m.lo52)/m.lo52*100 : null;

      const pass = rules.every(r=>{
        const v = rec[r.f];
        if(v==null || !isFinite(v)) return false;
        return r.o==="<" ? v < r.v : v > r.v;
      });
      if(pass) rows.push(rec);
    }catch(e){ errs++; }
    done++;
    if(bar){
      bar.style.width = (done/syms.length*100).toFixed(1)+"%";
      note.textContent = `Checked ${done} of ${syms.length}. ${rows.length} passing so far.`;
    }
  }

  scr.running = false;
  scr.results = {rows, cols, scanned:syms.length};
  scr.sort = {k:"cap", dir:-1};
  render();
  toast(errs ? `${rows.length} matches, ${errs} could not be read` : `${rows.length} matches`);
}

let jFilter = {q:"", status:"all"};

RENDERERS.journal = function(){
  let entries = S.journal.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  if(jFilter.status==="open") entries = entries.filter(e=>!e.outcome);
  if(jFilter.status==="closed") entries = entries.filter(e=>!!e.outcome);
  if(jFilter.q){
    const q = jFilter.q.toLowerCase();
    entries = entries.filter(e=>(e.sym+" "+e.thesis+" "+(e.tags||[]).join(" ")).toLowerCase().includes(q));
  }

  if(!S.journal.length){
    return `<div class="section">${card(`<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
      <h3>No entries yet</h3>
      <p>Write down what you thought before you find out whether you were right. Months later the journal is the only honest record of your reasoning, and the only way to see which kinds of thinking actually pay.</p>
      <button class="btn primary" id="jAdd">Write the first entry</button>
    </div>`)}</div>`;
  }

  const closed = S.journal.filter(e=>e.outcome && isFinite(e.outcome.result));
  const wins = closed.filter(e=>e.outcome.result>0).length;
  const avg = closed.length ? closed.reduce((a,e)=>a+e.outcome.result,0)/closed.length : null;
  const byConv = [1,2,3,4,5].map(c=>{
    const set = closed.filter(e=>e.conviction===c);
    return {c, n:set.length, avg: set.length ? set.reduce((a,e)=>a+e.outcome.result,0)/set.length : null};
  }).filter(x=>x.n);

  const tagStats = {};
  closed.forEach(e=>(e.tags||[]).forEach(t=>{
    tagStats[t] = tagStats[t] || {n:0,sum:0};
    tagStats[t].n++; tagStats[t].sum += e.outcome.result;
  }));
  const tags = Object.entries(tagStats).map(([t,v])=>({t,n:v.n,avg:v.sum/v.n})).sort((a,b)=>b.avg-a.avg);

  return `
  <div class="section">
    <div class="section-head"><h2>Journal</h2><span class="sub">${S.journal.length} ${S.journal.length===1?"entry":"entries"}</span>
      <div class="right"><button class="btn primary sm" id="jAdd">New entry</button></div></div>
    ${closed.length ? `<div class="stats">
      <div class="stat"><div class="k">Closed calls</div><div class="v">${closed.length}</div><div class="d">${S.journal.length-closed.length} still open</div></div>
      <div class="stat"><div class="k">Right</div><div class="v">${(wins/closed.length*100).toFixed(0)}%</div><div class="d">${wins} of ${closed.length}</div></div>
      <div class="stat"><div class="k">Average outcome</div><div class="v ${dirClass(avg)}">${pct(avg,1)}</div><div class="d">across closed calls</div></div>
    </div>` : ""}
  </div>

  ${byConv.length ? `<div class="section">
    <div class="section-head"><h2>Does your confidence mean anything?</h2><span class="sub">average outcome by how sure you were</span></div>
    ${card(byConv.map(x=>`<div class="bar-row">
      <div class="lbl">${x.c} of 5</div>
      <div class="bar-track"><div class="bar-fill" style="width:${clamp(Math.abs(x.avg)*2,3,100).toFixed(0)}%;background:var(${x.avg<0?"--down":"--up"})"></div></div>
      <div class="val ${dirClass(x.avg)}">${pct(x.avg,1)}</div>
    </div>`).join("") + `<p class="note" style="margin-top:10px">If the bars do not rise with confidence, your certainty is not carrying information. That is worth knowing.</p>`)}
  </div>` : ""}

  ${tags.length ? `<div class="section">
    <div class="section-head"><h2>By reason</h2><span class="sub">which kinds of idea have worked</span></div>
    ${card(tags.map(x=>`<div class="bar-row">
      <div class="lbl" style="width:110px">${esc(x.t)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${clamp(Math.abs(x.avg)*2,3,100).toFixed(0)}%;background:var(${x.avg<0?"--down":"--up"})"></div></div>
      <div class="val ${dirClass(x.avg)}">${pct(x.avg,1)}</div>
    </div>`).join(""))}
  </div>` : ""}

  <div class="section">
    <div class="section-head">
      <div class="right" style="margin-left:0;width:100%;gap:8px">
        <input type="text" id="jq" placeholder="Search entries" value="${esc(jFilter.q)}" style="max-width:260px" />
        <select id="jst" style="width:auto">
          <option value="all"${jFilter.status==="all"?" selected":""}>All</option>
          <option value="open"${jFilter.status==="open"?" selected":""}>Still open</option>
          <option value="closed"${jFilter.status==="closed"?" selected":""}>Closed</option>
        </select>
      </div>
    </div>
    ${entries.length ? entries.map(jEntryHTML).join("") : `<div class="card pad"><div class="empty"><p>No entries match that.</p></div></div>`}
  </div>`;
};

const TAG_SUGGEST = ["undervalued","growth","turnaround","moat","dividend","momentum","macro","tip","gut feel","averaging down"];

function journalModal(id=null, presetSym=""){
  const e = id ? S.journal.find(x=>x.id===id) : null;
  modal(e?"Edit entry":"New journal entry", `
    <div class="row c3">
      <label class="fld"><span>Ticker</span><input type="text" id="jSym" value="${esc(e?e.sym:presetSym)}" placeholder="AAPL" /></label>

    <label class="fld"><span>What would prove you wrong</span>

  `, `<button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="jSave">${e?"Save":"Add entry"}</button>`);

  $$("[data-tag]").forEach(b=>b.onclick = ()=>{

    <p class="note" style="margin-top:10px">A backup is a single file holding your watchlist, holdings, journal and keys. Keep one, because clearing this browser clears the app.</p>
    <input type="file" id="fileIn" accept="application/json" style="display:none" />
  `, `<button class="btn ghost" data-close>Close</button><button class="btn primary" id="setSave">Save</button>`);

  $("#setSave").onclick = ()=>{
    S.keys.finnhub = $("#kFh").value.trim();
    S.keys.twelve = $("#kTd").value.trim();
    const cur = $("#sCur").value.trim() || "$";
    const curChanged = cur !== CUR();
    S.settings.currency = cur;
    save();
    if(curChanged) touchPrefs();
    closeModal(); render(); toast("Saved");
  };
  $("#bExport").onclick = ()=>{
    const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "bellwether-backup-"+todayISO()+".json";
    a.click();

  };
  $("#bImport").onclick = ()=>$("#fileIn").click();
  $("#fileIn").onchange = ev=>{
    const f = ev.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const p = JSON.parse(r.result);
        if(!p || typeof p !== "object" || !("watch" in p)) throw new Error("bad file");
        confirmDo("Restoring replaces everything currently in the app.", ()=>{
          S = Object.assign(structuredClone(DEFAULT_STATE), p);
          /* A restored backup is the new truth: re-stamp every row and force a
             full re-pull, so the account ends up matching this file rather than
             silently winning on older timestamps. */
          S.sync = {lastPull:0, lastAt:0};
          ["watch","lots","journal"].forEach(n=>S[n].forEach(r=>touch(r)));
          S.settings._d = 1; S.settings.updatedAt = Date.now();
          save(); queuePush();
          closeModal(); render(); toast("Backup restored");
        }, "Restore");
      }catch(e){ toast("That does not look like a Bellwether backup.", true); }
    };
    r.readAsText(f);
  };
  $("#bCache").onclick = ()=>{
    C = {quotes:{},profiles:{},metrics:{},news:{},series:{}};
    saveCache(); render(); toast("Cache cleared");
  };
  $("#bWipe").onclick = ()=>confirmDo(
    (SESSION ? "This erases everything on this device and signs you out, so nothing syncs back down. Your account keeps its own copy until you delete it there. "
             : "This erases your watchlist, holdings, journal and keys from this browser. ") + "It cannot be undone.", ()=>{
    localStorage.removeItem(SKEY); localStorage.removeItem(CKEY);
    if(SESSION) setSession(null);
    S = structuredClone(DEFAULT_STATE);
    C = {quotes:{},profiles:{},metrics:{},news:{},series:{}};
    closeModal(); render(); toast("Everything erased");
  }, "Erase");
}

   runs and every feature still works. Signing in adds cross-device sync.

   No SDK — Supabase's auth and REST endpoints are plain HTTP, and a CDN
   dependency would break the offline file:// copy this app is built around.

   Fill these in from your project's Settings -> API page. The anon key is
   meant to be public: row-level security is what protects the data. */
const SUPA = {
  url:  "https://obspeaaskedturlkdyym.supabase.co",
  anon: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ic3BlYWFza2VkdHVybGtkeXltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2Mzc2MDcsImV4cCI6MjEwNTIxMzYwN30.3VPrgEqoCl64sO0Aw6NKIgPK1jKJGoJ7YlE1eEJolEM"
};
const SUPA_ON = () => !!(SUPA.url && SUPA.anon);
const SESSKEY = "bellwether.session";

let SESSION = null;
try{ SESSION = JSON.parse(localStorage.getItem(SESSKEY) || "null"); }catch(e){}

function setSession(s){
  SESSION = s;
  try{
    if(s) localStorage.setItem(SESSKEY, JSON.stringify(s));
    else localStorage.removeItem(SESSKEY);
  }catch(e){}
  paintAccount();
}

async function authCall(path, body, useToken=false){
  const h = {"apikey":SUPA.anon, "Content-Type":"application/json"};
  if(useToken && SESSION) h["Authorization"] = "Bearer "+SESSION.access_token;
  const r = await fetch(SUPA.url+"/auth/v1"+path, {method:"POST", headers:h, body:JSON.stringify(body||{})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || ("Sign in failed ("+r.status+")"));
  return j;
}
function storeAuth(j){
  if(!j.access_token) return null;
  const s = {
    access_token: j.access_token,
    refresh_token: j.refresh_token,
    expires_at: Date.now() + (j.expires_in || 3600)*1000,
    user: {id: j.user?.id, email: j.user?.email}
  };
  setSession(s);
  return s;
}
async function freshToken(){
  if(!SESSION) throw new Error("Not signed in.");
  if(Date.now() < SESSION.expires_at - 60000) return SESSION.access_token;
  const j = await authCall("/token?grant_type=refresh_token", {refresh_token:SESSION.refresh_token});
  const s = storeAuth(j);
  if(!s) throw new Error("Session expired. Sign in again.");
  return s.access_token;
}

async function rest(table, {method="GET", query="", body=null, upsert=false}={}){
  const token = await freshToken();
  const h = {"apikey":SUPA.anon, "Authorization":"Bearer "+token, "Content-Type":"application/json"};
  if(upsert) h["Prefer"] = "resolution=merge-duplicates,return=minimal";
  const r = await fetch(SUPA.url+"/rest/v1/"+table+query, {method, headers:h, body: body?JSON.stringify(body):undefined});
  if(!r.ok){
    const t = await r.text().catch(()=>"");
    if(r.status===404 || /relation .* does not exist/.test(t))
      throw new Error("The Bellwether tables are missing. Run schema.sql in your Supabase project.");
    throw new Error("Sync failed ("+r.status+"). "+t.slice(0,140));
  }
  return method==="GET" ? r.json() : null;
}

/* ---- local record bookkeeping ---- */
const touch = r => { r.updatedAt = Date.now(); r._d = 1; return r; };
function tomb(t, row){
  S.tombs = S.tombs || [];
  S.tombs.push({t, row: Object.assign({}, row, {updatedAt: Date.now()})});
}

/* ---- mutations: every change to synced data goes through these ---- */
function addWatch(sym, note=""){
  if(S.watch.some(w=>w.sym===sym)) return false;
  S.watch.push(touch({sym, note, added:Date.now()}));
  save(); queuePush(); return true;
}
function delWatch(sym){
  const w = S.watch.find(x=>x.sym===sym);
  if(w) tomb("watch", w);
  S.watch = S.watch.filter(x=>x.sym!==sym);
  save(); queuePush();
}
function putLot(rec){
  touch(rec);
  const i = S.lots.findIndex(x=>x.id===rec.id);
  if(i>=0) S.lots[i] = rec; else S.lots.push(rec);
  save(); queuePush();
}
function delLot(id){
  const l = S.lots.find(x=>x.id===id);
  if(l) tomb("lots", l);
  S.lots = S.lots.filter(x=>x.id!==id);
  save(); queuePush();
}
function putJournal(rec){
  touch(rec);
  const i = S.journal.findIndex(x=>x.id===rec.id);
  if(i>=0) S.journal[i] = rec; else S.journal.push(rec);
  save(); queuePush();
}
function delJournal(id){
  const j = S.journal.find(x=>x.id===id);
  if(j) tomb("journal", j);
  S.journal = S.journal.filter(x=>x.id!==id);
  save(); queuePush();
}
function touchPrefs(){ S.settings.updatedAt = Date.now(); S.settings._d = 1; save(); queuePush(); }

/* ---- shape translation ---- */
const iso = ms => new Date(ms || Date.now()).toISOString();
const ms  = s  => s ? new Date(s).getTime() : 0;
const uidOf = () => SESSION.user.id;

const MAP = {
  watch: {
    table: "bw_watchlist",
    key: r => r.sym,
    out: r => ({user_id:uidOf(), id:r.sym, sym:r.sym, note:r.note||"", added_at:iso(r.added),
                updated_at:iso(r.updatedAt), deleted_at:null}),
    in:  r => ({sym:r.sym||r.id, note:r.note||"", added:ms(r.added_at), updatedAt:ms(r.updated_at)})
  },
  lots: {
    table: "bw_lots",
    key: r => r.id,
    out: r => ({user_id:uidOf(), id:r.id, sym:r.sym, shares:r.shares, price:r.price, fees:r.fees||0,
                bought_on:r.date||null, note:r.note||"", sells:r.sells||[],
                updated_at:iso(r.updatedAt), deleted_at:null}),
    in:  r => ({id:r.id, sym:r.sym, shares:+r.shares, price:+r.price, fees:+r.fees||0,
                date:r.bought_on||"", note:r.note||"", sells:r.sells||[], updatedAt:ms(r.updated_at)})
  },
  journal: {
    table: "bw_journal",
    key: r => r.id,
    out: r => ({user_id:uidOf(), id:r.id, sym:r.sym, action:r.action||"note", entry_date:r.date||null,
                thesis:r.thesis||"", risks:r.risks||"", conviction:r.conviction||null,
                tags:r.tags||[], outcome:r.outcome||null,
                updated_at:iso(r.updatedAt), deleted_at:null}),
    in:  r => ({id:r.id, sym:r.sym, action:r.action, date:r.entry_date||"", thesis:r.thesis||"",
                risks:r.risks||"", conviction:r.conviction, tags:r.tags||[], outcome:r.outcome||null,
                updatedAt:ms(r.updated_at)})
  }
};

/* ---- the sync itself ---- */
let syncing = false, pushTimer = null;

function queuePush(){
  if(!SESSION || !SUPA_ON()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>syncNow(false), 1500);
}

async function syncNow(loud=true){
  if(!SESSION || !SUPA_ON() || syncing) return;
  if(!navigator.onLine){ if(loud) toast("Offline. Your changes are saved here and will sync later."); return; }
  syncing = true; paintAccount();
  try{
    await pull();
    await push();
    S.sync.lastAt = Date.now();
    save();
    if(loud) toast("Synced");
    render();
  }catch(e){
    if(loud || /tables are missing|Sign in again/.test(e.message)) toast(e.message, true);
  }finally{
    syncing = false; paintAccount();
  }
}

async function pull(){
  const since = S.sync.lastPull ? "&updated_at=gt."+encodeURIComponent(iso(S.sync.lastPull)) : "";
  let newest = S.sync.lastPull || 0;

  for(const name of ["watch","lots","journal"]){
    const m = MAP[name];
    const rows = await rest(m.table, {query:"?select=*"+since});
    for(const row of rows){
      newest = Math.max(newest, ms(row.updated_at));
      const arr = S[name];
      const i = arr.findIndex(x=>m.key(x) === (name==="watch" ? (row.sym||row.id) : row.id));
      if(row.deleted_at){
        if(i>=0) arr.splice(i,1);
        continue;
      }
      const incoming = m.in(row);
      if(i<0) arr.push(incoming);
      else if(incoming.updatedAt >= (arr[i].updatedAt||0)) arr[i] = incoming;
    }
  }

  const prefs = await rest("bw_prefs", {query:"?select=*"+since});
  if(prefs.length){
    const p = prefs[0];
    newest = Math.max(newest, ms(p.updated_at));
    if(ms(p.updated_at) >= (S.settings.updatedAt||0)){
      S.settings.currency = p.currency || "$";
      S.settings.updatedAt = ms(p.updated_at);
      S.settings._d = 0;
    }
  }

  /* A second of slack: rows written while this pull was in flight would
     otherwise fall in the gap between lastPull and the next request. */
  S.sync.lastPull = Math.max(newest, S.sync.lastPull||0) - 1000;
  save();
}

async function push(){
  for(const name of ["watch","lots","journal"]){
    const m = MAP[name];
    const dirty = S[name].filter(r=>r._d);
    if(dirty.length){
      dirty.forEach(r=>{ if(!r.updatedAt) r.updatedAt = Date.now(); });
      await rest(m.table, {method:"POST", query:"?on_conflict=user_id,id", upsert:true, body:dirty.map(m.out)});
      dirty.forEach(r=>{ delete r._d; });
    }
  }

  const tombs = S.tombs || [];
  if(tombs.length){
    for(const name of ["watch","lots","journal"]){
      const m = MAP[name];
      const mine = tombs.filter(t=>t.t===name);
      if(!mine.length) continue;
      const rows = mine.map(t=>Object.assign(m.out(t.row), {deleted_at: iso(t.row.updatedAt)}));
      await rest(m.table, {method:"POST", query:"?on_conflict=user_id,id", upsert:true, body:rows});
    }
    S.tombs = [];
  }

  if(S.settings._d){
    await rest("bw_prefs", {method:"POST", query:"?on_conflict=user_id,id", upsert:true,
      body:[{user_id:uidOf(), id:"prefs", currency:CUR(), updated_at:iso(S.settings.updatedAt), deleted_at:null}]});
    S.settings._d = 0;
  }
  save();
}

      else msg("Check your email to confirm the account, then sign in.");
    }catch(e){ msg(e.message); }
  };
  $("#auForgot").onclick = async ()=>{
    const e0 = $("#auEmail").value.trim();
    if(!e0){ msg("Enter your email first."); return; }
    try{ await authCall("/recover", {email:e0}); msg("If that address has an account, a reset link is on its way."); }
    catch(e){ msg(e.message); }
  };
}

/* First sync after signing in on a device that may already hold local data.
   Pull first so anything already in the account wins where it is newer, then
   mark whatever is left as dirty so local-only rows are carried up rather
   than quietly dropped. */
async function firstSync(){
  const hadLocal = S.watch.length || S.lots.length || S.journal.length;
  syncing = true; paintAccount();
  try{
    await pull();
    if(hadLocal){
      ["watch","lots","journal"].forEach(n=>S[n].forEach(r=>{ if(!r.updatedAt){ r.updatedAt = Date.now(); r._d = 1; } }));
    }
    await push();
    S.sync.lastAt = Date.now(); save();
    toast("Synced");
  }catch(e){ toast(e.message, true); }
  finally{ syncing = false; paintAccount(); render(); }
}
